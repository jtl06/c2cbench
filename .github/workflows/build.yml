name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        cxx: [g++, clang++]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CXX=${{ matrix.cxx }} CXXFLAGS="-O2 -std=c++17 -Wall -Wextra -Werror"
      - name: Reserve hugepages
        run: sudo sysctl -w vm.nr_hugepages=16
      - name: Smoke test, both modes
        run: |
          ./c2cbench -c 0,1 -l 8 -r 20 -n 1 --csv
          ./c2cbench -c 0,1 -l 8 -r 20 -n 1 --hist
          ./c2cbench -m chase -c 0,1 -l 256 --csv
